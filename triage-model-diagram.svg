<?xml version="1.0" encoding="UTF-8"?>
<svg id="dia" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 742" role="img" aria-label="De flow: een Challenge gaat via de intake door de triage. Die kiest tussen Discovery en direct bouwen. Beide routes komen samen bij AI-versneld prototypen, waar Experience design en Engineering elkaar overlappen in het codeprototype. Alles wat gebouwd wordt gaat langs de kwaliteitslat, met lussen voor designiteratie en coderefinement. Daarna volgt het productieklare resultaat, en voedt de evolutielus de volgende triage.">
          <style>
            .nbox{fill:var(--surface,#17171f);stroke:rgba(255,255,255,.22)}
            .ntxt{fill:var(--ink,#ece9e3);font:600 15px "Helvetica Neue",Arial,sans-serif;text-anchor:middle}
            .ctitle{fill:var(--ink,#ece9e3);font:700 17px "Helvetica Neue",Arial,sans-serif;text-anchor:middle}
            .route{font:700 11px "Helvetica Neue",Arial,sans-serif;letter-spacing:.1em;text-anchor:middle}
          </style>

          <!-- ============ DE KWALITEITSLAT ============ -->
          <ellipse cx="905" cy="320" rx="302" ry="255" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.4"/>
          <text x="905" y="47" class="route dnode" data-target="s05" fill="var(--muted,#a29ea9)">DE KWALITEITSLAT</text>

          <!-- ============ DE DRIE CIRKELS ============ -->
          <circle cx="560" cy="320" r="175" fill="#5af08c" fill-opacity="0.10" stroke="#5af08c" stroke-opacity="0.45" stroke-width="1.2"/>
          <circle cx="790" cy="320" r="175" fill="#ff7d33" fill-opacity="0.10" stroke="#ff7d33" stroke-opacity="0.45" stroke-width="1.2"/>
          <circle cx="1020" cy="320" r="175" fill="#3fc6ae" fill-opacity="0.10" stroke="#3fc6ae" stroke-opacity="0.45" stroke-width="1.2"/>

          <text x="560" y="246" class="ctitle dnode" data-target="s03">Discovery &amp;</text>
          <text x="560" y="268" class="ctitle dnode" data-target="s03">strategie</text>

          <text x="790" y="246" class="ctitle">Experience</text>
          <text x="790" y="268" class="ctitle">design</text>

          <text x="1020" y="246" class="ctitle">Engineering &amp;</text>
          <text x="1020" y="268" class="ctitle">infrastructuur</text>

          <!-- ============ START ============ -->
          <polygon points="10,286 220,286 220,264 280,320 220,376 220,354 10,354" fill="var(--surface,#17171f)" stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>
          <text x="115" y="314" class="route dnode" data-target="s00" fill="var(--ink,#ece9e3)">CHALLENGE</text>
          <text x="115" y="334" class="route dnode" data-target="s02" fill="var(--muted,#a29ea9)">&amp; INTAKE</text>

          <polygon points="350,276 394,320 350,364 306,320" fill="var(--surface,#17171f)" stroke="rgba(255,255,255,.40)" stroke-width="1.4"/>
          <text class="ntxt dnode" data-target="s02" x="350" y="325" style="font-size:13px">Triage</text>

          <!-- ============ ROUTE 1 · DISCOVERY ============ -->
          <path d="M398,314 C450,300 505,302 586,316" fill="none" stroke="#5af08c" stroke-width="1.8"/>
          <polygon points="590.0,318.0 577.4,320.3 579.1,311.3" fill="#5af08c"/>
          <text x="470" y="288" class="route dnode" data-target="s03" fill="#5af08c">DISCOVERY</text>

          <!-- ============ ROUTE 2 · ALLEEN DELIVERY ============ -->
          <path d="M344,364 C326,520 440,610 620,606 C706,603 710,470 710,360" fill="none" stroke="#9b7bff" stroke-width="1.8" stroke-dasharray="7 5"/>
          <polygon points="710.0,354.0 714.6,366.0 705.4,366.0" fill="#9b7bff"/>
          <text x="486" y="548" class="route dnode" data-target="s03" fill="#9b7bff">ALLEEN DELIVERY</text>

          <!-- ============ AI-VERSNELD PROTOTYPEN ============ -->
          <polygon points="600,307 822,307 822,293 860,320 822,347 822,333 600,333" fill="#9b7bff" fill-opacity="0.20" stroke="#9b7bff" stroke-opacity="0.75" stroke-width="1.2"/>
          <text x="711" y="324" class="route" fill="var(--ink,#ece9e3)">AI-VERSNELD PROTOTYPEN</text>

          <!-- ============ HET CODEPROTOTYPE ============ -->
          <g transform="translate(0,-37)">
            <path d="M905,330 L913,348 L933,351 L919,365 L922,385 L905,376 L888,385 L891,365 L877,351 L897,348 Z" fill="var(--ink,#ece9e3)"/>
          </g>
          <text x="905" y="373" class="route" fill="var(--ink,#ece9e3)">CODEPROTOTYPE</text>

          <!-- ============ DE TWEE LUSSEN ============ -->
          <path d="M786,202 C850,152 960,152 1019,197" fill="none" stroke="#ff7d33" stroke-width="1.8"/>
          <polygon points="1024.0,200.0 1011.6,196.5 1017.2,189.1" fill="#ff7d33"/>
          <text x="905" y="136" class="route dnode" data-target="s06" fill="#ff7d33">DESIGNITERATIE</text>

          <path d="M1024,438 C960,488 850,488 791,443" fill="none" stroke="#3fc6ae" stroke-width="1.8"/>
          <polygon points="786.0,440.0 798.4,443.5 792.8,450.9" fill="#3fc6ae"/>
          <text x="905" y="508" class="route dnode" data-target="s06" fill="#3fc6ae">CODEREFINEMENT</text>

          <!-- ============ HET RESULTAAT ============ -->
          <polygon points="1230,286 1440,286 1440,264 1500,320 1440,376 1440,354 1230,354" fill="#5af08c" fill-opacity="0.14" stroke="#5af08c" stroke-opacity="0.7" stroke-width="1.2"/>
          <text x="1335" y="325" class="route dnode" data-target="s07" fill="var(--ink,#ece9e3)">OUTCOME</text>

          <!-- ============ DE EVOLUTIELUS ============ -->
          <path d="M1335,356 C1344,576 1300,664 1100,668 L420,668 C244,668 88,652 86,366" fill="none" stroke="#8a8591" stroke-width="1.5"/>
          <polygon points="86.0,360.0 90.7,372.0 81.5,372.0" fill="#8a8591"/>
          <polygon points="700.0,668.0 713.0,663.0 713.0,673.0" fill="#8a8591"/>
          <text x="905" y="698" class="route dnode" data-target="s07" fill="var(--faint,#8a8591)">DE EVOLUTIELUS</text>
        </svg>
